services:
  backend:
    environment:
      NODE_ENV: production
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
    ports:
      - '${BACKEND_PORT:-5000}:5000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    mem_limit: 512m
    cpus: '0.50'
    pids_limit: 200

  frontend:
    environment:
      NODE_ENV: production
      HOME: /tmp
    ports:
      - '${FRONTEND_PORT:-3000}:3000'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m,mode=1777
      - /app/.next/cache:rw,nosuid,nodev,noexec,size=128m,uid=1000,gid=1000,mode=0750
    mem_limit: 512m
    cpus: '0.50'
    pids_limit: 200
